# Fly.io configuration for the DrakoTune web service.
#
# IMPORTANT: `app` must be globally unique across Fly. `fly launch` will offer
# to rename it; if you edit by hand, pick something like "drakotune-<you>".
#
# SINGLE INSTANCE IS REQUIRED. The job store is in-memory, so all requests for
# one upload must hit the same machine. Keep the machine count at 1
# (`fly scale count 1`); do not enable multi-machine autoscaling.

app = "drakotune"
primary_region = "iad"   # change to your nearest region (e.g. "lhr", "fra", "sjc")

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"     # scale to zero when idle (cheap); wakes on request
  auto_start_machines = true
  min_machines_running = 0        # set to 1 if you want it always warm (no cold start)

  # Cost protection (M44): caps concurrent in-flight requests at the Fly proxy
  # itself, on top of the app-level rate limiter + job-slot semaphore in
  # src/webapp/ratelimit.py. hard_limit rejects (fails fast) past this count
  # rather than queuing indefinitely on a single small machine.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 16

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"          # cold import of librosa/numba takes a few seconds
    method = "get"
    path = "/health"

# ~180 MB of Python-tracked allocation per audio-minute (M36 benchmark); true
# RSS runs higher with libs + STFT copies.
#
# 2 GB was NOT enough and the claim that it "comfortably handles a 5-minute
# vocal" was wrong. On 2026-08-04 a real full-length rap vocal through a V3 mode
# OOM-killed the machine at 1.85 GB RSS:
#
#   Out of memory: Killed process 644 (uvicorn) anon-rss:1892992kB
#
# Because the job store is in-memory, the reboot also destroyed the in-flight
# job, so the browser waited on a request that could never return. Raised to
# 4 GB, and the app now refuses over-long input up front rather than dying
# partway through (MAX_AUDIO_SECONDS in src/webapp/app.py).
[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 1
