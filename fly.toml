# Fly.io configuration for the DrakoTune web service.
#
# IMPORTANT: `app` must be globally unique across Fly. `fly launch` will offer
# to rename it; if you edit by hand, pick something like "drakotune-<you>".
#
# SINGLE INSTANCE IS REQUIRED. The job store is in-memory, so all requests for
# one upload must hit the same machine. Keep the machine count at 1
# (`fly scale count 1`); do not enable multi-machine autoscaling.

app = "drakotune"
primary_region = "iad"   # change to your nearest region (e.g. "lhr", "fra", "sjc")

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Must stay 1. Scaling to zero is incompatible with this app's upload size and
  # boot time: importing librosa/numba takes ~10 s, the Fly proxy gives up
  # waiting after ~8.5 s, and a multi-megabyte upload cannot be replayed --
  #
  #   failed to connect to machine: gave up after 15 attempts (in 8.456s)
  #   cannot retry/replay request because request body has been read past
  #   what we're willing to buffer
  #
  # so a cold start during a real upload always aborts the connection. Keeping
  # one machine warm costs continuously; the alternative is deferring the heavy
  # imports so boot fits inside the proxy's window, which is real work.
  min_machines_running = 1

  # Cost protection (M44): caps concurrent in-flight requests at the Fly proxy
  # itself, on top of the app-level rate limiter + job-slot semaphore in
  # src/webapp/ratelimit.py. hard_limit rejects (fails fast) past this count
  # rather than queuing indefinitely on a single small machine.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 16

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"          # cold import of librosa/numba takes a few seconds
    method = "get"
    path = "/health"

# ~180 MB of Python-tracked allocation per audio-minute (M36 benchmark); true
# RSS runs higher with libs + STFT copies.
#
# The claim that 2 GB "comfortably handles a 5-minute vocal" was wrong: a real
# full-length rap vocal OOM-killed the machine twice on 2026-08-04, the second
# time at 3.84 GB. The root cause was not sizing -- it was true-peak metering
# oversampling the entire file in one FFT (see delivery_metrics._true_peak).
# Blocking that call cut a 138-second render from 3.4 GB to 1.2 GB peak.
#
# 4 GB is now headroom rather than a workaround: ~1.2 GB measured at 138 s
# implies roughly 3 GB at the 6-minute MAX_AUDIO_SECONDS ceiling, which the
# app refuses to exceed rather than dying partway through.
# cpus = 2 is required, not a performance choice: Fly caps shared-cpu-1x at
# 2048 MiB, and `fly deploy` refuses 4 GB on a single shared CPU with
# "invalid config.guest.memory_mb, cannot exceed 2048 MiB". Two shared CPUs
# raise the ceiling to 4 GB. This does increase cost.
[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2
